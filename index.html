<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- Ensures responsive design -->
    <title>Silverbullet Offensive v4.5</title>
    <script src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
    
    <style>
        :root { --bg:#020306; --panel:#1a0f1e; --accent:#ff007f; --text:#fce8f3; } 
        body { background-color: var(--bg); color: var(--text); font-family: 'Courier New', monospace; margin: 0; padding: 15px;}

        .container { max-width: 90vw; margin: auto; border: 1px solid #444; box-shadow: 0 0 30px rgba(255,0,127,0.2); padding: 20px;}
        
        h1 { text-align:center; color:#ff007f; letter-spacing: 2px;}
        p.subtitle { text-align:center; color:#888; }

        /* Developer Button Styles */
        .dev-btn-container { display:flex; justify-content:center; margin-top:-10px;}
        .tg-link { 
            background-color: #2AABEE !important; color:white !important; text-decoration:none !important; 
            font-size: 1rem; padding: 10px 20px !important; border-radius: 6px !important; box-shadow: 0 5px 15px rgba(42, 171, 238, 0.6); 
            animation: pulse-green 2s infinite alternate;} /* Subtle pulse */
            @keyframes pulse-green { from{box-shadow:0 0 0 rgba(42,171,238,0);} to{box-shadow:0 0 20px rgba(42,171,238,0.8);}}

        .controls-row { display:flex; gap:10px; margin-top:15px;}
        input[type="text"], select { background:#1a0f1e; border:1px solid #444; color:white; padding:10px; flex-grow:1;}
        
        button.primary-btn { 
            background-color: transparent !important; border: 1px solid var(--accent) !important; 
            color: var(--accent) !important; font-weight:bold !important; cursor:pointer !important; }
        button.primary-btn:hover:not(:disabled){ box-shadow: 0 0 20px rgba(255,0,127,0.6)!important; transform:scale(1.02); }

        /* Terminal Output */
        .terminal-output { 
            background-color: var(--panel); height: 35vh; overflow-y:auto; padding: 10px; margin-top:15px; border-left:4px solid #ffaa00;}
            div.term-line { margin-bottom:4px; line-height:1.3;}
            
            .t-info { color:#b0c4de;}
            .t-success { color:#00ff7f;}
            .t-danger{ color:#ffaa00;}
        }

        /* Table Styles */
        table { width:100%; border-collapse: collapse; font-size: 0.9rem; margin-top:-2px;}
        th, td { padding: 8px; text-align:left; border-bottom: 1px solid #333; } 
    </style>
</head>
<body>

<div class="container">
    
    <h1>Silverbullet Offensive v4.5</h1>
    <p class="subtitle">Passive Recon & Active Vulnerability Scanning</p>

    <!-- Developer Button -->
    <div class="dev-btn-container">
        <a href="https://t.me/Silverbullets_bot" target="_blank" class="tg-link">
            DEV CONSOLE: @Silverbullets_bot
        </a>
    </div>

    <!-- Scan Controls -->
    <div class="controls-row">
        <input type="text" id="mainTargetInput" placeholder="[!] Enter Target (e.g., tesla.com)">
        <button id="btnScan" onclick="runFullScan()" class="primary-btn">▶ EXECUTE SCAN</button>
    </div>

    <!-- Terminal Output -->
    <h3>[ SYSTEM LOG & EXPLOIT STREAM ]</h3>
    <div class="terminal-output" id="termOutput">
        <div class="term-line t-info"><small>[INIT]</small> Welcome to Silverbullet v4.5...</div>
        <div class="term-line t-info"><small>[WAITING]</small> Awaiting target input...</div>
    </div>

    <!-- Results Table -->
     <h3 style="color:#b0c4de; margin-top:20px;">EXPLOITATION MATRIX (Live)</h3>
    <table id="exploitTable">
        <thead><tr><th>TARGET / IP</th><th>POTENTIAL EXPLOITS</th></tr></thead> <!-- Simplified header for mobile -->
        <tbody id="resultsBody"></tbody>
    </table>

    <!-- Visual Map Placeholder -->
     <canvas id="visMap" width="95%" height="150" style="margin-top:20px; border: 1px solid #444; background:#08050a;"></canvas>

<script>
// --- Core Logic (Simplified) ---
const state = { assets:[], cvesFound:[] };

function termLog(msg, type='info') {
    const div = document.createElement('div');
    div.className = 'term-line'; 
    
    // Color coding helper
    if(type==='success' || msg.includes('[+]')) { 
        div.innerHTML += `<span class="t-success">[${msg.split(' ')[0]}]</span> ${msg.replace(/\[.*\]/,'').trim()}`; 
    } else if (type==='warning' || msg.includes('[!]')) { 
         div.innerHTML += `<span style="color:#ffaa00">[${msg}]</span>`; 
    } else { 
         div.innerHTML += `<small>[${new Date().toLocaleTimeString()}]</strong> <b>${msg}</b>`; 
    }
    
    document.getElementById('termOutput').prepend(div); // Newest on top
    
    // Auto scroll to bottom of terminal
    const tOut = document.getElementById('termOutput');
    tOut.scrollTop = 0; 
}

// --- Main Scan Functionality ---
async function runFullScan() {
    let target = document.getElementById('mainTargetInput').value.trim();
    if(!target) return termLog("Error: Target not specified.", 'warning');

    state.assets = []; 
    const resultsBody = document.getElementById('resultsBody');
    
    // Simulate steps for demo purposes (Replace with real API calls like Shodan/Hackertarget here)
    
    step1(target); // Subdomain find
    
}

function step1(target) {
    // Mocking subdomain discovery via DNS resolver (API simulation)
    setTimeout(() => {
        termLog(`[+] Found subdomains: ${target}.dev, api.${target}`, 'success'); 
        
        // Adding a "main" IP mockup to demonstrate table filling
        scanMainIP("185.234.XXX.XXX", target).then(r => { addRowToTable(r.ip, r.service, r.cve || 'Clean'); });

    }, 1000);
}

// --- Simulation Helper for Demo Results ---
async function scanMainIP(ip, originalDomain) {
    return new Promise(resolve => {
        setTimeout(() => {
            // Randomly simulate finding a vulnerability or clean state
            const isVuln = Math.random() > 0.7; 
            let serviceData = "Apache httpd v2.4"; 
            
            if(isVuln) {
                termLog(`[CRIT] Found Vulnerable Service on ${ip}`, 'danger');
                serviceData += " (High Severity CVE-2021-XXXXX)"; // Mocked data
                
                addRowToTable(ip, `Port 80/443`, `"${serviceData}"`);
                
                 // Add to visual map logic here later...
                 updateStats(); 
            } else {
                termLog(`[+] Clean Scan: ${originalDomain} -> IP: ${ip}`, 'success');
                addRowToTable(ip, `Port 80/443`, `"${serviceData}"`);
            }

            resolve({ ip, service });
        }, 800);
    });
}

function updateAssets() { document.getElementById('s-assets').innerText = state.assets.length; }


// Helper function to add rows to the table dynamically
function addRowToTable(ip, port, serv) {
    const tbody = document.getElementById('resultsBody');
    
    // If empty (first load), ensure visibility of headers
    if(tbody.innerHTML === '') tbody.style.display='table'; 

    const tr = document.createElement('tr');
    tr.innerHTML=`<td><strong>${ip}</strong></td> <td style="font-size:0.85rem;">${port}<br><small>${serv}</small></td>`;
    tbody.prepend(tr); // Newest on top
    
}

</script>
</div>

</body>
</html>
